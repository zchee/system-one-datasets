- config: jev_decisions_v1
  suite: agent_action
  kinds:
  - choice
  description: 'Next-action selection for tool-using agents: given the visible agent state, which of the available
    tools/actions should be called next?'
  splits:
    test:
      file: agent_action/jev_decisions_v1/test.jsonl
      rows: 1000
      rows_with_soft_label: 0
      sha256: b8e6fab878da5aceef0dd00a5cbd91a202552fdb934881471cc4c371e24374b9
  source:
    hf_id: samatv256/jev-decisions-v1
    hf_config: default
    hf_split: test
    file: data/test/test-00000-of-00001.parquet
    revision: c12aadf1f01c72616bfab0b02480e21806397669
  upstream:
  - hf_id: nvidia/Nemotron-SFT-Agentic-v2
  - hf_id: nvidia/Nemotron-RL-Agentic-Conversational-Tool-Use-Pivot-v1
  - hf_id: nvidia/Nemotron-RL-Agentic-Function-Calling-Pivot-v1
  - hf_id: nvidia/Open-SWE-Traces
  license: per row
  licenses:
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - MIT
  - cc-by-4.0
  license_rule: Rows whose upstream is nvidia/Open-SWE-Traces carry the SPDX id of the source repository (provenance.source_metadata_json.repo_license)
    in license; an Open-SWE-Traces row without a usable SPDX id would keep cc-by-4.0 and is counted in selection.license_fallbacks.
    Rows from the Nemotron datasets carry no repository license and are cc-by-4.0. Every row is also subject to
    the CC BY 4.0 attribution terms of jev-decisions-v1 and its NVIDIA upstream datasets.
  license_as_stated_by_source: cc-by-4.0 (dataset card). All four NVIDIA upstream cards list CC BY 4.0; some also
    list Apache-2.0/MIT (and BSD for Open-SWE-Traces). Open-SWE-Traces records carry a per-repository SPDX license
    (provenance.source_metadata_json.repo_license). See the source's SOURCE_LICENSES.md before redistribution.
  soft_labels: false
  transformations:
  - 'Source: the test partition only (data/test/test-00000-of-00001.parquet, one shard), read in Arrow batches from
    the Hugging Face cache.'
  - 'Eligibility: training.choice_eligible is true; 2..255 candidates; ordered_targets empty; candidate names non-empty
    and unique; target.candidate_id matches exactly one candidate whose name equals target.action_name.'
  - 'Token cap: rows whose state+question exceed ~32000 tokens (serialized JSON chars / 3, the validator''s warning
    threshold) are excluded before sampling; no row is truncated.'
  - 'question.type = ''choice''; question.instructions = the fixed Choice question the publisher uses in its general-clean-50k
    config: ''Given the current state and available options,\nwhich option should be selected?''. The record carries
    no per-row question text; the user''s task stays in state.user_goal.'
  - 'question.criteria = {candidate.name: candidate.description, or null when empty}, in source candidate order.
    Parameter schemas, candidate metadata, and target arguments are not included.'
  - label = target.action_name (the matched candidate's name); options = criteria keys in order; soft_label = null.
  - 'state = {system, user_goal, environment, history}: system and user_goal copied as strings (omitted when null/empty;
    kept even when they repeat a history turn); environment = decoded state.environment_json (omitted when null/empty);
    history = [{role, content}] with content = decoded payload_json. Serialized JSON that does not parse is kept
    as the raw string (count below).'
  - upstream = the record's source field (the NVIDIA dataset it was derived from); license = see license_rule.
  - id = 'jev_decisions_v1/test/<source id>'. Labels, provenance, and training fields are never copied into state.
  - 'Sampling: candidate-count buckets 2, 3-4, 5-8, 9-16, 17+; the 1,000 rows are split across buckets in proportion
    to rows available after the token cap (largest-remainder method); within a bucket, rows with the smallest sha256(''20260930:<source
    id>'') are taken. Selection is independent of source row order. Rows are written by bucket, then by that key.'
