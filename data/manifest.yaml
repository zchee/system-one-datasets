name: system-one-datasets
description: Typed-decision datasets for System One models, normalized to the /v1/systemone wire format
format: JSON Lines, one row per line, at <suite>/<config>/<split>.jsonl. state, question, and soft_label are JSON-encoded
  strings (soft_label is the text 'null' when absent); every other field is a plain JSON value.
row_fields:
- id
- suite
- config
- kind
- state
- question
- options
- label
- soft_label
- source
- source_revision
- upstream
- license
wire_request: '{''state'': json.loads(row[''state'']), ''model'': <model>, ''questions'': {<any id>: json.loads(row[''question''])}}'
rebuild: uv run python -m system_one_datasets build --out data/
validate: uv run python -m system_one_datasets validate data/
configs:
- config: civil_comments
  suite: moderation
  kinds:
  - noul
  description: Is this online comment toxic? Soft label = share of annotators who said yes.
  splits:
    test:
      file: moderation/civil_comments/test.jsonl
      rows: 2000
      rows_with_soft_label: 2000
      sha256: ad73dc3e56fce9cfb7311268230e2935e355eb9d9f44f32acdb0b7e7bfb8ea6a
    validation:
      file: moderation/civil_comments/validation.jsonl
      rows: 500
      rows_with_soft_label: 500
      sha256: 51663b5d1ad61149562bb50ad1f55714216fa7937ebda8e1a7a7503badea73ba
  source:
    hf_id: Praveenrajus/jev-bench
    hf_config: civil_comments
    revision: 18f88da81c28c2bec55edc31f63f2afdfba109ea
  upstream:
    hf_id: google/civil_comments
    hf_config: default
  license: cc0-1.0
  license_as_stated_by_source: cc0-1.0
  soft_labels: true
  transformations:
  - state and question are JSON text in the source and here; they are decoded and re-encoded compactly (orjson,
    key order preserved), so the decoded values are identical to the source's and can be sent to POST /v1/systemone
    as-is.
  - 'options: choice = criteria keys in order; score = level indices ''0''..''K-1''; noul = [''0'', ''1''].'
  - 'soft_label normalized to {option: probability}: noul scalar P(yes) p -> {''0'': 1 - p, ''1'': p}; score array
    -> keyed by level index; choice object -> every option, absent options 0.0. Stored as JSON text; the text ''null''
    when the source has none.'
  - id and label copied from the source; rows kept in source order; no rows added, dropped, or rewritten.
  - upstream = the original dataset jev-bench built this config from (hf_id in jev-bench's manifest.json); license
    = that dataset's license as jev-bench states it, without the parenthetical note.
  - 'jev-bench build note: Natural class balance (~8% toxic); test cap raised to 2000 so positives are not too thin.
    train/validation are drawn from the 97k-row HF validation split (the 1.8M-row train split is not needed).'
